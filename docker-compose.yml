services:
  app:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - uploads:/uploads
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=3002
      - DB_HOST=buchhaltung-db-local
      - DB_PORT=3307
      - DB_USER=${DB_USER:-fsi}
      - DB_PASSWORD=${DB_PASSWORD:-fsi_password}
      - DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_password}
      - DB_NAME=${DB_NAME:-fsi_buchhaltung}
      - DB_CONN_LIMIT=${DB_CONN_LIMIT:-5}
      - CASH_REGISTER_DB_HOST=kasse-db
      - CASH_REGISTER_DB_PORT=3306
      - UPLOAD_DIR=/uploads
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-5}
      - SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME:-fsi_session}
      - SESSION_SECRET=${SESSION_SECRET:-dev_change_me}
      - SESSION_INACTIVITY_MINUTES=${SESSION_INACTIVITY_MINUTES:-30}
      - SESSION_MAX_AGE_MINUTES=${SESSION_MAX_AGE_MINUTES:-1440}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - APP_BASE_URL=${APP_BASE_URL:-/}
      - NOTIFICATIONS_DISPATCH_DISABLED=${NOTIFICATIONS_DISPATCH_DISABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@example.com}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:vorstand@example.com}
    ports:
      - "3002:3002"
    networks:
      - default
      - fsi-shared
    command: sh -c "npm ci && node scripts/migrate-event-cost-centre-splits.mjs && node scripts/migrate-event-planning.mjs && node scripts/migrate-invoice-paid-at.mjs && node scripts/migrate-invoice-position-description-nullable.mjs && node scripts/migrate-app-settings.mjs && node scripts/migrate-cash-count-register-checks.mjs && node scripts/migrate-user-password-change-required.mjs && node scripts/migrate-checklist-task-link.mjs && node scripts/migrate-bank-statements.mjs && node scripts/migrate-shift-templates.mjs && node scripts/migrate-calendar-token.mjs && node scripts/migrate-member-self-service.mjs && node scripts/migrate-notifications.mjs && node scripts/migrate-wiki.mjs && node scripts/migrate-audit-log.mjs && node scripts/migrate-appointments.mjs && node scripts/migrate-association-documents.mjs && npm run setup:audit && node scripts/create-connection-db-user.mjs && node scripts/seed-admin.mjs && npm run build && node .output/server/index.mjs"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11.4
    command: ["mariadbd", "--port=3307"]
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_password}
      - MARIADB_DATABASE=${DB_NAME:-fsi_buchhaltung}
      - MARIADB_USER=${DB_USER:-fsi}
      - MARIADB_PASSWORD=${DB_PASSWORD:-fsi_password}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3308:3307"
    networks:
      default:
        aliases:
          - buchhaltung-db-local
      fsi-shared:
        aliases:
          - buchhaltung-db
    healthcheck:
      test: ["CMD", "mariadb", "-u", "${DB_USER:-fsi}", "-p${DB_PASSWORD:-fsi_password}", "-h", "localhost", "-P", "3307", "-e", "SELECT 1;"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
  uploads:
  node_modules:

networks:
  fsi-shared:
    name: fsi-shared
